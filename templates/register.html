{% extends "base.html" %}

{% block title %}Register | Multi-Cloud Storage Vault{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3.5rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="nav-brand-logo" style="width: 48px; height: 48px; font-size: 1.3rem; margin: 0 auto 1rem auto;">MC</div>
            <h2 style="font-weight: 800; font-size: 1.4rem;">Create Account</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.3rem;">Sign up to access Personal Multi-Cloud Vault</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="role">Account Type / Role</label>
                <select id="role" name="role" class="form-control">
                    <option value="user" selected>Normal User</option>
                    <option value="admin">Admin Owner</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
                Create Account & Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
